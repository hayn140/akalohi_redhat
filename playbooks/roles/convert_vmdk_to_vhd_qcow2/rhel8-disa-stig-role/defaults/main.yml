#######################################################
# MANUAL STIGS OR NOT APPLICABLE
#######################################################
# The following STIGs should either be completed manually or with an Ansible playbook/role that is customized for the target environment.
# RHEL-08-010000 (CAT I): RHEL 8 must be a vendor-supported release; should never be an issue in the cloud
# RHEL-08-010001 (CAT II): Install and enable the latest Trellix ENSLTP package (v1r14: Changed "McAfee" to "Trellix")
# RHEL-08-010010 (CAT II): Apply vendor packaged system security patches and updates regularly (site-specific)
# RHEL-08-010030 (CAT II): Configure encryption at rest (v1r14: N/A if encryption provided by hypervisor or disk storage array in virtualized environment)
# RHEL-08-010090 (CAT II): Configure RHEL 8 for PKI-based authentication; obtain DoD root CA file from cyber.mil
# RHEL-08-010100 (CAT II): Ensure every private key on the system have a passcode
# RHEL-08-010400 (CAT II): Implement certificate status checking for multifactor authentication
# RHEL-08-010600 (CAT II): Mount removable media devices with "nodev" option; cloud servers do not use removable media
# RHEL-08-010610 (CAT II): Mount removable media devices with "noexec" option; cloud servers do not use removable media
# RHEL-08-010620 (CAT II): Mount removable media devices with "nosuid" option; cloud servers do not use removable media
# RHEL-08-010680 (CAT II): Require two or more nameservers in /etc/nsswitch.conf
# RHEL-08-010690 (CAT II): Ensure user-defined PATH environment var only include allowable dirs
# RHEL-08-010730 (CAT II): Change interactive user home dirs permissions
# RHEL-08-010731 (CAT II): Change interactive user home dir files permissions
# RHEL-08-010740 (CAT II): Change interactive user home dirs group permissions
# RHEL-08-010741 (CAT II): Change interactive user home dir files group permissions
# RHEL-08-010750 (CAT II): Ensure assigned home dirs exist
# RHEL-08-010770 (CAT II): Change interactive user initialization files permissions
# RHEL-08-020000 (CAT II): Temporary accounts must be provisioned with an expiration time of 72 hours or less; temporary accounts are not likely used
# RHEL-08-020010 (CAT II): pam_faillock config; N/A for RHEL 8.2 or later
# RHEL-08-020012 (CAT II): pam_faillock config; N/A for RHEL 8.2 or later
# RHEL-08-020014 (CAT II): pam_faillock config; N/A for RHEL 8.2 or later
# RHEL-08-020016 (CAT II): pam_faillock config; N/A for RHEL 8.2 or later
# RHEL-08-020018 (CAT II): pam_faillock config; N/A for RHEL 8.2 or later
# RHEL-08-020020 (CAT II): pam_faillock config; N/A for RHEL 8.2 or later
# RHEL-08-020022 (CAT II): pam_faillock config; N/A for RHEL 8.2 or later
# RHEL-08-020028 (CAT II): Configure non-default faillock tally directory for RHEL 8.1 or older (N/A)
# RHEL-08-020090 (CAT II): Configure sssd.conf for PKI authentication
# RHEL-08-020102 (CAT II): pwquality config; N/A for RHEL 8.4 or later
# RHEL-08-020103 (CAT II): pwquality config; N/A for RHEL 8.4 or later
# RHEL-08-020104 (CAT II): pwquality config; N/A for RHEL 8.4 or later
# RHEL-08-020250 (CAT II): Configure PAM for PKI authentication (N/A if approved alternate MFA is used)
# RHEL-08-020270 (CAT II): Temporary accounts must automatically expire within 72 hours; temporary accounts are not likely used
# RHEL-08-020290 (CAT II): Configure sssd.conf for PKI authentication (N/A if approved alternate MFA is used)
# RHEL-08-020352 (CAT II): Remove umask statement from all local interactive user's initialization files
# RHEL-08-030660 (CAT II): Store at least one week of audit records when records are not immediately sent to remote server; varies by system
# RHEL-08-030710 (CAT II): Encrypt the transfer of audit records to a different system or storage media; requires unique certificates
# RHEL-08-030720 (CAT II): Authenticate the remote logging server for off-loading audit logs; requires unique certificates
# RHEL-08-030740 (CAT II): Set maxpoll to 16 in /etc/chrony.conf
# RHEL-08-040030 (CAT II): Configure firewalld to prohibit/restrict use of functions, ports, protocols, and/or services as defined in the PPSM CAL and vulnerability assessments
# RHEL-08-040090 (CAT II): Configure firewalld to employ a deny-all, allow-by-exception policy for allowing connections to other systems
# RHEL-08-040101 (CAT II): A firewall must be active (firewalld)
# RHEL-08-040136 (CAT II): fapolicy module must be enabled; requires extensive custom configuration
# RHEL-08-040137 (CAT II): fapolicy module must be configured to employ a deny-all, permit-by-exception policy; requires extensive custom configuration
# RHEL-08-040140 (CAT II): Install/configure USBGuard (not common in cloud environments)
# RHEL-08-040400 (CAT II): Prevent non-privileged users from executing privileged functions (semanage login) (v1r14: If required, enable "ssh_sysadm_login" SELinux boolean and document with ISSO)
# RHEL-08-030603 (CAT III): Enable Linux audit logging for the USBGuard daemon (not common in cloud environments)
# RHEL_08_010471 (CAT III): Start and enable rngd service (v1r14: N/A for RHEL 8.4 or later running in FIPS mode)


