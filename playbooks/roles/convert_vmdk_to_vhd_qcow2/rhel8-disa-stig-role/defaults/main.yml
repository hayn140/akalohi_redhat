#######################################################
# PAM STIGS
#######################################################
# This task deploys fully STIGed pam.d files (password-auth-local, system-auth-local, & postlogin-local). This assumes that the system is RHEL 8.4 or newer.
# It satisfies CAT I's RHEL-08-020331 & RHEL-08-020332.
# It satisfies CAT II's RHEL-08-010159, RHEL-08-010160, RHEL-08-020025, RHEL-08-020026, RHEL-08-020100, RHEL-08-020101, RHEL-08-020220, & RHEL-08-020221.
# It satisfies CAT III RHEL-08-020340.
pam_stig_files: true
# This task STIGs settings in /etc/security/faillock.conf.
# Satisfies CAT II's RHEL-08-020011, RHEL-08-020013, RHEL-08-020015, RHEL-08-020017, RHEL-08-020021, & RHEL-08-020023.
pam_faillock: true


#######################################################
# AUDIT RULES STIGS
#######################################################
# This task removes any existing audit rules and replaces them with fully STIG'ed audit rule files (01-audit.rules & 99-finalize.rules).
# It satisfies a large amount of STIGs.
audit_rules: true


