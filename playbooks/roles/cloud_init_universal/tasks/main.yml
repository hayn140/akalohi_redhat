---
# tasks file for clout_init_universal

- name: Deploy RHEL cloud.cfg
  ansible.builtin.template:
    src: rhel_cloud.cfg.j2
    dest: /etc/cloud/cloud.cfg
    owner: root
    group: root
    mode: 0644

- name: Deploy /root/sat-register.sh Satellite Registration Script
  ansible.builtin.template:
    src: sat_register.sh.j2
    dest: /root/sat-register.sh
    owner: root
    group: root
    mode: 0744
