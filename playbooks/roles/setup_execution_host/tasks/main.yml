---
# tasks file for setup_execution_host
# Due to python dependency issues, this playbook works best on RHEL9, RHEL8 gave many issues. 
# We created nctx-ff-aapw02@nctx.nsa.ic.gov for this very reason

- name : Configure pip library
  ansible.builtin.copy:
    src: pip.conf
    dest: /etc/pip.conf
    owner: root
    group: root
    mode: 0644

- name: Install pip and awscli (RHEL 9 or Amazon Linux)
  ansible.builtin.dnf:
    name: 
      - python3-pip
      - awscli
    state: latest
  when: > 
    (ansible_distribution == "RedHat" and ansible_distribution_major_version == "9") or (ansible_distribution == "Amazon")
  
