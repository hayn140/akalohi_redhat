---
# tasks file for grub_timeout
- name: Set 10s grub timeout
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_TIMEOUT=0'
    line: 'GRUB_TIMEOUT=10'
  register: grub

- name: Generate boot loader entries
  ansible.builtin.shell:
    cmd: kernel-install add $(uname -r) /lib/modules/$(uname -r)/vmlinuz
  args:
    creates: /boot/loader/entries/ZZ-rescue-mode.conf
  register: grub

- name: Regenerate grub
  ansible.builtin.command: 
    cmd: grub2-mkconfig -o /boot/grub2/grub.cfg
