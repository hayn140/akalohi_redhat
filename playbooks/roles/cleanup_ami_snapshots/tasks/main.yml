---
# tasks file for cleanup_ami_snapshots

- name: Deregister Pre-Provisioned AMI & Delete associated Snapshot
  amazon.aws.ec2_ami:
    image_id: "{{ imported_ami_id }}"
    delete_snapshot: true
    state: absent
    region: "{{ aws_region }}"
    access_key: "{{ aws_access_key }}"
    secret_key: "{{ aws_secret_key }}"
    session_token: "{{ aws_session_token }}"
    validate_certs: false
  become: false
  when: imported_ami_id is defined
