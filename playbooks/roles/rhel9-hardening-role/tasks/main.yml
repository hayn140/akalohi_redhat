    regexp: '^.include = /etc/crypto-policies/back-ends/opensslcnf.config$'
    line: '.include = /etc/crypto-policies/back-ends/opensslcnf.config'
    insertafter: '\[ crypto_policy \]'
  when:
  - rhel_09_672035 | bool
  tags: cat_all,cat2

- name: Configure OpenSSL library to use only DOD-approved TLS encryption (crypto-policies) (RHEL-09-672040)
  ansible.builtin.lineinfile:
    path: /etc/crypto-policies/back-ends/opensslcnf.config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  with_items:
  - { regexp: '^TLS.MinProtocol =', line: 'TLS.MinProtocol = TLSv1.2' }
  - { regexp: '^DTLS.MinProtocol =', line: 'DTLS.MinProtocol = DTLSv1.2' }
  when:
  - rhel_09_672040 | bool  
  tags: cat_all,cat2

- name: Gather list of installed packages
  ansible.builtin.package_facts:
    manager: auto
  when:
  - rhel_09_672050 | bool
  tags: cat_all,cat2

- name: Configure BIND (if installed) to use system crypto policy (named.conf) (RHEL-09-672050)
  ansible.builtin.lineinfile:
    path: /etc/named.conf
    regexp: 'include "/etc/crypto-policies/back-ends/bind.config";'
    line: '  include "/etc/crypto-policies/back-ends/bind.config";' # Leading whitespace for proper indentation
    insertafter: '^options {'
  ignore_errors: true
  when:
  - rhel_09_672050 | bool
  - "'bind' in ansible_facts.packages"
  tags: cat_all,cat2


#######################################################
# DISA CAT III STIGS
#######################################################
- name: Enable mitigations against processor-based vulnerabilities (grub) (RHEL-09-212050)
  # The grubby command will update kernel arguments persistently, without the need to modify any configuration files.
  # It will automatically apply all arguments to current and future installed kernels.
  # For BIOS systems, it updates the GRUB_CMDLINE_LINUX variable in /etc/default/grub
  # For EFI systems, it updates entries in /etc/kernel/cmdline
  # After a reboot, boot parameters can be verified by running 'cat /proc/cmdline'
  ansible.builtin.command: grubby --update-kernel=ALL --args="pti=on"
  when:
  - rhel_09_212050 | bool
  tags: cat_all,cat3

- name: Enable auditing of processes that start prior to the audit daemon (grub) (RHEL-09-212055)
  # The grubby command will update kernel arguments persistently, without the need to modify any configuration files.
  # It will automatically apply all arguments to current and future installed kernels.
  # For BIOS systems, it updates the GRUB_CMDLINE_LINUX variable in /etc/default/grub
  # For EFI systems, it updates entries in /etc/kernel/cmdline
  # After a reboot, boot parameters can be verified by running 'cat /proc/cmdline'
  ansible.builtin.command: grubby --update-kernel=ALL --args="audit=1"
  when:
  - rhel_09_212055 | bool
  tags: cat_all,cat3

- name: Remove all software components after updated versions have been installed (RHEL-09-214035)
  ansible.builtin.lineinfile:
    path: "{{ rhel_09_214035.path }}"
    regexp: "{{ rhel_09_214035.regexp }}"
    line: "{{ rhel_09_214035.setting }}={{ rhel_09_214035.value }}"
  when:
  - rhel_09_214035.managed | bool
  tags: cat_all,cat3,RHEL-09-214035

- name: Disable cramfs kernel module (modprobe.d) (requires reboot) (RHEL-09-231195)
  ansible.builtin.lineinfile:
    path: /etc/modprobe.d/cramfs.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: modules_conf_t
    selevel: s0
  with_items:
  - { regexp: '^install cramfs', line: 'install cramfs /bin/false' }
  - { regexp: '^blacklist cramfs', line: 'blacklist cramfs' } 
  when:
  - rhel_09_231195 | bool
  tags: cat_all,cat3

- name: Ensure chrony is installed (RHEL-09-252025 & RHEL-09-252030)
  block:
    - name: Ensure chrony is installed (RHEL-09-252025 & RHEL-09-252030)
      ansible.builtin.dnf:
        name: "chrony"
        state: installed
  rescue:
    - name: Log findings for RHEL-09-252025 & RHEL-09-252030 to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- RHEL-09-252025 & RHEL-09-252030: Encountered error during installation of chrony package'] }}"
  when:
  - (rhel_09_252025 | bool) or (rhel_09_252030 | bool)
  tags: cat_all,cat3

- name: Disable chrony daemon from acting as a server (chrony.conf) (RHEL-09-252025)
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^port'
    line: 'port 0'
  ignore_errors: true
  when:
  - rhel_09_252025 | bool
  notify:
  - restart_chronyd
  tags: cat_all,cat3

- name: Disable network management of the chrony daemon (chrony.conf) (RHEL-09-252030)
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^cmdport'
    line: 'cmdport 0'
  ignore_errors: true
  when:
  - rhel_09_252030 | bool
  notify:
  - restart_chronyd
  tags: cat_all,cat3

- name: Audit logging must be enabled for the USBGuard daemon (RHEL-09-291025)
  ansible.builtin.lineinfile:
    path: /etc/usbguard/usbguard-daemon.conf
    regexp: '^AuditBackend='
    line: 'AuditBackend=LinuxAudit'
  ignore_errors: true
  when:
  - rhel_09_291025 | bool
  - "'usbguard' in ansible_facts.packages"
  tags: cat_all,cat3

- name: Limit the number of concurrent sessions to 10 for all accounts (limits.d) (RHEL-09-412040)
  ansible.builtin.lineinfile:
    path: /etc/security/limits.d/RHEL-09-412040.conf
    regexp: '^\*\s+hard\s+maxlogins.*'
    line: '* hard maxlogins 10'
    create: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - rhel_09_412040 | bool
  tags: cat_all,cat3

- name: Allocate an audit backlog limit of sufficient size (grub) (RHEL-09-653120)
  # The grubby command will update kernel arguments persistently, without the need to modify any configuration files.
  # It will automatically apply all arguments to current and future installed kernels.
  # For BIOS systems, it updates the GRUB_CMDLINE_LINUX variable in /etc/default/grub
  # For EFI systems, it updates entries in /etc/kernel/cmdline
  # After a reboot, boot parameters can be verified by running 'cat /proc/cmdline'
  ansible.builtin.command: grubby --update-kernel=ALL --args="audit_backlog_limit=8192"
  when:
  - rhel_09_653120 | bool
  tags: cat_all,cat3


