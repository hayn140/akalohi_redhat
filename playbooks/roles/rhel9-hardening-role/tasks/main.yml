  # For BIOS systems, it updates the GRUB_CMDLINE_LINUX variable in /etc/default/grub
  # For EFI systems, it updates entries in /etc/kernel/cmdline
  # After a reboot, boot parameters can be verified by running 'cat /proc/cmdline'
  ansible.builtin.command: grubby --update-kernel=ALL --remove-args="systemd.confirm_spawn"
  when:
  - rhel_09_212015 | bool
  tags: cat_all,cat2

