  ansible.builtin.lineinfile: 
    path: /etc/chrony.conf
    line: server  {{ ntp_server_response.user_input }}  iburst maxpoll 16
    state: present
  when:
  # - proceed_with_ntp
  - rhel_09_252020 | bool
  tags: cat_all,cat2
  
- name: restart the ntp service (RHEL-09-252020)
