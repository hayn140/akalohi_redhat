- name: Passwords for new users & password changes must have 60-day maximum lifetime (login.defs) (RHEL-09-411010)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MAX_DAYS.*$'
    line: 'PASS_MAX_DAYS 60'
  when:
  - rhel_09_411010 | bool
  tags: cat_all,cat2

- name: Gather list of users that have a maximum password expiration greater than 60 days or never expire (RHEL-09-411015)
  ansible.builtin.shell: for USER in $(awk -F ':' '($3 >= 1000) && ($7 !~ /nologin/) { print $1 }' /etc/passwd); do grep $USER /etc/shadow | awk -F ':' '($5 > 60) || ($5 <= 0) { print $1 }'; done
  ignore_errors: true
  failed_when: false
  changed_when: maxpw_users.stdout | length > 0
  register: maxpw_users
  when:
  - rhel_09_411015 | bool
  tags: cat_all,cat2

- name: User account passwords must have a 60-day maximum lifetime restriction (exclude system accounts) (RHEL-09-411015)
  ansible.builtin.command: chage -M 60 "{{ item }}"
  ignore_errors: true
  loop: "{{ maxpw_users.stdout_lines }}"
  when:
  - rhel_09_411015 | bool
  - maxpw_users is changed
  tags: cat_all,cat2

- name: Local interactive user accounts must be assigned a home directory at creation (login.defs) (RHEL-09-411020)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^CREATE_HOME.*$'
    line: 'CREATE_HOME yes'
  when:
  - rhel_09_411020 | bool
  tags: cat_all,cat2

- name: Gather list of UMASK overrides that are present in user initialization files (RHEL-09-411025)
  # The following command will search all non-root interactive user home dirs for any instance of umask and returns a list of files
  ansible.builtin.shell: grep -i '^\s*umask' /home/*/.* 2> /dev/null | awk -F ':' '{ print $1 }'
  ignore_errors: true
  failed_when: false
  changed_when: umask_override_files.stdout | length > 0
  register: umask_override_files
  when:
  - rhel_09_411025 | bool
  tags: cat_all,cat2

- name: Remove any overrides of UMASK in all local interactive user initialization files (RHEL-09-411025)
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(?!#)(\s*(?i)umask.*)$' # ^(?!#) = ignore lines that begin with "#"; (?i) = make search of "umask" case-insensitive
    replace: '#\1' # This comments out all matching lines; the regexp much be enclosed in parenthesis for this to work
  with_items:
  - "{{ umask_override_files.stdout_lines }}"
  when:
  - rhel_09_411025 | bool
  tags: cat_all,cat2

- name: Disable account identifiers (users, groups, roles, & devices) after 35 days of inactivity (useradd) (RHEL-09-411050)
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: '^INACTIVE'
    line: 'INACTIVE=35'
  when:
  - rhel_09_411050 | bool
  tags: cat_all,cat2

- name: Unauthorized/unnecessary accounts must not be present (games & gopher) (RHEL-09-411095)
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
    force: true
  loop:
  - games
  - gopher
  ignore_errors: true
  when:
  - rhel_09_411095 | bool
  tags: cat_all,cat2

- name: Gather list of world-writable programs that are present in initialization files (RHEL-09-411115)
  ansible.builtin.shell: for FILE in $(find / -type f -perm -0002 2> /dev/null | grep -v '^/proc' | grep -v '^/sys'); do grep $FILE /home/*/.* 2> /dev/null | awk -F ':' '{ print $2 }'; done
  ignore_errors: true
  failed_when: false
  changed_when: world_writable_prgms.stdout | length > 0
  register: world_writable_prgms
  when:
  - rhel_09_411115 | bool
  tags: cat_all,cat2

- name: Log findings for RHEL-09-411115 to log file
  ansible.builtin.set_fact:
    log_var: "{{ log_var + ['- RHEL-09-411115 (CAT II): World-writable files found in user init files. Changed permissions to 0755.\n{{ world_writable_prgms.stdout }}'] }}"
  when:
  - world_writable_prgms is changed
  - rhel_09_411115 | bool
  tags: cat_all,cat2

- name: Initialization files must not execute world-writable programs (RHEL-09-411115)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0755'
  with_items:
  - "{{ world_writable_prgms.stdout_lines }}"
  ignore_errors: true
  when:
  - world_writable_prgms.stdout | length > 0
  - rhel_09_411115 | bool
  tags: cat_all,cat2

