- name: Configure fapolicy (RHEL-09-433015)
  block:  
    - name: Install fapolicyd (RHEL-09-433015)
      ansible.builtin.package:
        name: fapolicyd
        state: present

    - name:  Set fapolicyd to permissive (RHEL-09-433015)
      ansible.builtin.lineinfile:
