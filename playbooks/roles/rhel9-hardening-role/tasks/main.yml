- name: (INFO ONLY) Determine capacity of audit storage volume (RHEL-09-653030)
  ansible.builtin.shell: df -Ph /var/log/audit/ | awk 'NR == 2{ print $5+0 }' # This will return only the numerical percentage of the space used on the volume
  # NR == 2 says apply to the 2nd line of output (which is output without the usual df field headers)
  # print $5+0 is applied to that line, taking the fifth ($5) field which is %Use, +0 removes the % from the output, leaving us with a whole number
  ignore_errors: true
  register: audit_volume_capacity
  changed_when: audit_volume_capacity.stdout | int >= 85 # We will log if the audit storage volume has 15 percent or less of space available, prompting investigation by a sysadmin
  when:
  - rhel_09_653030 | bool
  tags: cat_all,cat2

