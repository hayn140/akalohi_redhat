- name: Require reauthentication when using "sudo" command (RHEL-09-432015)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^Defaults\s*timestamp_timeout.*$'
    line: 'Defaults timestamp_timeout=0'
  when:
  - rhel_09_432015 | bool
