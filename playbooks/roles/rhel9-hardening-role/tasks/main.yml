---

#######################################################
# GATHER SYSTEM INFORMATION
#######################################################
- name: Gather list of installed packages
  ansible.builtin.package_facts:
    manager: auto
  tags: cat_all,always

- name: Determine if system uses BIOS
  ansible.builtin.stat:
    path: /boot/grub2/grub.cfg
  register: is_bios
  tags: cat_all,always

- name: Determine if system uses EFI
  ansible.builtin.stat:
    path: /boot/efi/EFI/redhat/grub.cfg
  register: is_efi
  tags: cat_all,always

# If either Xorg or Xwayland, or both, binaries exist, the system is techinically GUI-capable and GUI-related STIGs apply (credit: William Moulton)
- name: Determine if system is GUI-capable
  ansible.builtin.find:
    paths: /usr/bin/
    patterns: 'Xorg,Xwayland'
  register: gui_capable
  tags: cat_all,always


#######################################################
# INSTALL REQUIRED PACKAGES
#######################################################
- name: Install grubby (required for role)
  block:
    - name: Install grubby (required for role)
      ansible.builtin.dnf:
        name: "grubby"
        state: installed
  rescue:
    - name: Log findings to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- INFORMATIONAL: Encountered error during installation of grubby package'] }}"
  tags: cat_all,always


#######################################################
# GRUB SUPERUSER CONFIGURATION
#######################################################
# The following tasks are interactive and will allow the user to create a unique GRUB superuser username and password.

- name: Prompt User - Set Grub Super USERNAME & PASSWORD (RHEL-09-212010 & RHEL-09-212020)
  ansible.builtin.pause:
    prompt: "\n\nDo you want to set the Grub Super USERNAME & PASSWORD? If not, you will need to configure this manually.\n\nType 'yes' or 'no' and hit 'ENTER'\n\n"
  register: set_grubuserpass_response
  delegate_to: all
  run_once: true
  when:
  - set_grub_superuser | bool
  tags: cat_all,cat1

- name: Set 'proceed_with_set_grubuserpass' variable - (RHEL-09-212010 & RHEL-09-212020)
  ansible.builtin.set_fact:
    proceed_with_set_grubuserpass: "{{ set_grubuserpass_response.user_input | lower == 'yes' }}"
  delegate_to: all
  run_once: true
  when:
  # - set_grubuserpass_response
  - set_grub_superuser | bool
  tags: cat_all,cat1

- name: Enter and Confirm Unique Grub Superuser USERNAME (RHEL-09-212010 & RHEL-09-212020)
  block:
    - name: Prompt user for a Grub Superuser USERNAME
      ansible.builtin.pause:
        prompt: "\nPlease type a unique USERNAME you'd like to use for your Grub Superuser (Do not use 'root' or 'admin' or 'administrator') and hit ENTER"
      register: grub_superuser_username

    - name: Confirm Grub Superuser USERNAME
      ansible.builtin.pause:
        prompt: "\nPlease confirm your Grub Superuser USERNAME and hit ENTER.\nIf you made a mistake please restart this playbook."
      register: grub_superuser_username_confirm
      until: grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
      retries: 5
      delay: 0
  rescue:
    - name: Proceed with Playbook
      ansible.builtin.debug:
        msg: "Usernames do not match after 5 attempts. Continuing with playbook WITHOUT setting a Unique Grub Superuser Username and Password. You will need to either rerun this playbook or configure the Grub Superuser manually."
  delegate_to: all
  run_once: true
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  tags: cat_all,cat1

- name: Create unique grub superuser USERNAME (BIOS) (RHEL-09-212010 & RHEL-09-212020)
  ansible.builtin.replace:
    path: /etc/grub.d/01_users
    regexp: 'set superusers=.*'
    replace: 'set superusers="{{ grub_superuser_username.user_input }}"'
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_bios.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: Create unique grub superuser USERNAME (BIOS) (RHEL-09-212010 & RHEL-09-212020)
  ansible.builtin.replace:
    path: /etc/grub.d/01_users
    regexp: 'password_pbkdf2.*'
    replace: 'password_pbkdf2 {{ grub_superuser_username.user_input }} \${GRUB2_PASSWORD}'
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_bios.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: Create unique grub superuser USERNAME (EFI) (RHEL-09-212010 & RHEL-09-212020)
  ansible.builtin.replace:
    path: /etc/grub.d/01_users
    regexp: 'password_pbkdf2.*'
    replace: 'password_pbkdf2 {{ grub_superuser_username.user_input }} \${GRUB2_PASSWORD}'
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_efi.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: Create unique grub superuser USERNAME (EFI) (RHEL-09-212010 & RHEL-09-212020)
  ansible.builtin.replace:
    path: /etc/grub.d/01_users
    regexp: 'set superusers=.*'
    replace: 'set superusers="{{ grub_superuser_username.user_input }}"'
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_efi.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: BIOS or EFI related GRUB Superuser tasks
  block:
    - name: Regenerate grub.cfg file (BIOS) (RHEL-09-212010 & RHEL-09-212020)
      ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
      when:
      - set_grub_superuser | bool
      - is_bios.stat.exists
      # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input  

  rescue:
    - name: Regenerate grub.cfg file (EFI) (RHEL-09-212010 & RHEL-09-212020)
      ansible.builtin.command: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
      when:
      - set_grub_superuser | bool
      - is_efi.stat.exists
      # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input  
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  tags: cat_all,cat1

- name: Enter and Confirm Grub Superuser PASSWORD (RHEL-09-212010 & RHEL-09-212020)
  block:
    - name: Prompt user for a Grub Superuser PASSWORD
      ansible.builtin.pause:
        prompt: "\nPlease type the PASSWORD you'd like to use for your Grub Superuser '{{ grub_superuser_username.user_input }}' and hit ENTER"
        echo: false
      register: grub_superuser_password
      no_log: true    # Prevent passwords from showing in logs

    - name: Confirm Grub Superuser PASSWORD
      ansible.builtin.pause:
        prompt: "\nPlease confirm your Grub Superuser PASSWORD and hit ENTER"
        echo: false
      register: grub_superuser_password_confirm
      no_log: true    # Prevent passwords from showing in logs
      until: grub_superuser_password_confirm.user_input == grub_superuser_password.user_input
      retries: 5
      delay: 0
  rescue:
    - name: Proceed with Playbook
      ansible.builtin.debug:
        msg: "Passwords do not match after 5 attempts. Continuing with playbook WITHOUT setting Grub Superuser password. You will need to either rerun this playbook or set it manually running the command: $sudo grub2-setpassword."
  delegate_to: all
  run_once: true
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: Install python3-pexpect package to use ansible.builtin.expect module
  ansible.builtin.dnf:
    name: python3-pexpect
    state: present
  when: 
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  # - grub_superuser_password_confirm.user_input == grub_superuser_password.user_input
  tags: cat_all,cat1

- name: Set grub2 superuser password (RHEL-09-212010 & RHEL-09-212020)
  ansible.builtin.expect:
    command: grub2-setpassword
    responses:
      'Enter password:': "{{ grub_superuser_password.user_input }}"
      'Confirm password:': "{{ grub_superuser_password.user_input }}"
  no_log: true    # Prevent passwords from showing in logs
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  # - grub_superuser_password_confirm.user_input == grub_superuser_password.user_input
  tags: cat_all,cat1


#######################################################
# ENABLE FIPS
#######################################################
# The following task enables FIPS mode.
# It satisfies CAT I's RHEL-09-671010 & RHEL-09-672030.
# It satisfies CAT II RHEL-09-672045.

# - name: Prompt User - Enable FIPS Mode (RHEL-09-671010, RHEL-09-672030, RHEL-09-672045)
#   ansible.builtin.pause:
#     prompt: "\n\nDo you want to enable FIPS mode. If not, you will need to configure this manually.\n\nType 'yes' or 'no' and hit 'ENTER'\n\n"
#   register: enable_fips_response
#   delegate_to: all
#   run_once: true
#   when:
#   - fips_enable | bool
#   tags: cat_all,cat1

# - name: Set 'proceed_with_enable_fips' variable - (RHEL-09-671010, RHEL-09-672030, RHEL-09-672045)
#   ansible.builtin.set_fact:
#     proceed_with_enable_fips: "{{ enable_fips_response.user_input | lower == 'yes' }}"
#   delegate_to: all
#   run_once: true
#   when:
#   # - enable_fips_response
#   - fips_enable | bool
#   tags: cat_all,cat1
  
- name: Get FIPS mode status (RHEL-09-671010, RHEL-09-672030, & RHEL-09-672045)
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: fips_status
  changed_when: false
  when:
  # - proceed_with_enable_fips
  - fips_enable | bool
  tags: cat_all,cat1,cat2

- name: Enable FIPS (requires reboot; automatically adds "fips=1" to grub) (RHEL-09-671010, RHEL-09-672030, & RHEL-09-672045)
  ansible.builtin.command: fips-mode-setup --enable
  when:
  # - proceed_with_enable_fips
  - fips_enable | bool
  - fips_status.stdout != '1'
  tags: cat_all,cat1,cat2


#######################################################
# TMUX CONFIGURATION
#######################################################
# There are fix total STIGs related to tmux: four CAT II's and one CAT III.
# CAT II TMUX STIGS
- name: The tmux package must be installed (RHEL-09-412010)
  block:
    - name: The tmux package must be installed (RHEL-09-412010)
      ansible.builtin.dnf:
        name: "tmux"
        state: installed
  rescue:
    - name: Log findings for RHEL-09-412010 to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- RHEL-09-412010: Encountered error during installation of tmux package'] }}"
  when:
  - rhel_09_412010 | bool
  tags: cat_all,cat2

- name: Prompt User if they want to enable TMUX lock Session
  ansible.builtin.pause:
    prompt: "\nDo you want to ensure that a TMUX session control is automatically started at shell initialization? (yes/no) \n\nThis will startup a tmux session everytime you SSH into the system.\n"
  register: initiate_tmux_response
  delegate_to: all
  run_once: true
  when:
  - rhel_09_412015 | bool
  tags: cat_all,cat2

- name: Set proceed_with_tmux variable
  ansible.builtin.set_fact:
    proceed_with_tmux: "{{ initiate_tmux_response.user_input | lower == 'yes' }}"
  when:
  - rhel_09_412015 | bool
  tags: cat_all,cat2

- name: Initialize the tmux terminal multiplexer as each shell is called (/etc/profile.d/tmux.sh) (RHEL-09-412015)
  ansible.builtin.copy:
    src: tmux.sh
    dest: /etc/profile.d/tmux.sh
    backup: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: bin_t
    selevel: s0
  when:
  - rhel_09_412015 | bool
  # - proceed_with_tmux
  tags: cat_all,cat2

- name: Enable user session lock and 15 minute timeout (tmux) (Satisfies CAT II's RHEL-09-412020 & RHEL-09-412025)
  ansible.builtin.copy:
    src: tmux.conf
    dest: /etc/tmux.conf
    backup: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - tmux_config | bool
  notify:
  - source_tmux_conf
  tags: cat_all,cat2

# CAT III TMUX STIGS
- name: Prevent users from disabling the tmux terminal multiplexer (/etc/shells) (RHEL-09-412030)
  ansible.builtin.lineinfile:
    path: /etc/shells
    regexp: '.*tmux.*'
    state: absent
  when:
  - rhel_09_412030 | bool
  tags: cat_all,cat3


#######################################################
# DISA CAT I STIGS
#######################################################
- name: Disable systemd Ctrl-Alt-Delete burst key sequence (RHEL-09-211045)
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^CtrlAltDelBurstAction'
    line: 'CtrlAltDelBurstAction=none'
  when:
  - rhel_09_211045 | bool
  notify:
  - reload_systemd
  tags: cat_all,cat1

- name: Disable x86 Ctrl-Alt-Delete key sequence (RHEL-09-211050)
  # Stop, disable, and mask the systemd target
  block:
    - name: Disable x86 Ctrl-Alt-Delete key sequence (RHEL-09-211050)
      # NOTE! For some systems a mask Ansible systemd task will not work as a link may exist pointing ctrl-alt-del.target to reboot.target.
      # Here, we manually perform the mask function.
      ansible.builtin.file:
        src: /dev/null
        dest: /etc/systemd/system/ctrl-alt-del.target
        state: link
        force: true
  rescue:
    - name: Log findings for RHEL-09-211050 to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- RHEL-09-211050: Encountered error during mask of ctrl-alt-del target'] }}"
  when:
  - rhel_09_211050 | bool
  tags: cat_all,cat1

- name: Check GPG signature of packages before installation (RHEL-09-214015)
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^gpgcheck='
    line: 'gpgcheck=1'
  when:
  - rhel_09_214015 | bool
  tags: cat_all,cat1

- name: Check GPG signature of locally install packages (RHEL-09-214020)
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^localpkg_gpgcheck='
    line: 'localpkg_gpgcheck=1'
  when:
  - rhel_09_214020 | bool
  tags: cat_all,cat1

- name: Gather list of software repo config files (RHEL-09-214025)
  ansible.builtin.find:
    paths: /etc/yum.repos.d/
    patterns: '*.repo'
    file_type: file
  register: repos
  when:
  - rhel_09_214025 | bool
  tags: cat_all,cat1

- name: Enforce GPG signature verification for all software repositories (RHEL-09-214025)
  ansible.builtin.replace:
    path: "{{ item.path }}"
    backup: false
    regexp: 'gpgcheck=0'
    replace: 'gpgcheck=1'
  with_items:
  - "{{ repos.files }}"
  when:
  - rhel_09_214025 | bool
  tags: cat_all,cat1

- name: Remove File Transfer Protocol (FTP) package (vsftpd) (RHEL-09-215015)
  block:
    - name: Remove File Transfer Protocol (FTP) package (vsftpd) (RHEL-09-215015)
      ansible.builtin.dnf:
        name: "vsftpd"
        state: absent
  rescue:
    - name: Log findings for RHEL-09-215015 to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- RHEL-09-215015: Encountered error during removal of vsftpd package'] }}"
  when:
  - rhel_09_215015 | bool
  tags: cat_all,cat1

- name: Remove Trivial File Transfer Protocol (TFTP) server package (tftp-server) (RHEL-09-215060)
  block:
    - name: Remove Trivial File Transfer Protocol (TFTP) server package (tftp-server) (RHEL-09-215060)
      ansible.builtin.dnf:
        name: "tftp-server"
        state: absent
  rescue:
    - name: Log findings for RHEL-09-215060 to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- RHEL-09-215060: Encountered error during removal of tftp-server package'] }}"
  when:
  - rhel_09_215060 | bool
  tags: cat_all,cat1

- name: Search for any shosts.equiv files on the system (RHEL-09-252070)
  ansible.builtin.find:
    paths: /
    patterns: 'shosts.equiv'
    file_type: file
    recurse: true
  register: shosts_equiv
  changed_when: shosts_equiv.matched > 0
  failed_when: false
  when:
  - rhel_09_252070 | bool
  tags: cat_all,cat1

- name: Remove any shosts.equiv files found on the system (RHEL-09-252070)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  with_items:
  - "{{ shosts_equiv.files }}"
  when:
  - rhel_09_252070 | bool
  - shosts_equiv is changed
  tags: cat_all,cat1

- name: Search for any .shosts files on the system (RHEL-09-252075)
  ansible.builtin.find:
    paths: /
    patterns: '*.shosts'
    file_type: file
    recurse: true
  register: shosts_files
  changed_when: shosts_files.matched > 0
  failed_when: false
  when:
  - rhel_09_252075 | bool
  tags: cat_all,cat1

- name: Remove any .shosts files found on the system (RHEL-09-252075)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  with_items:
  - "{{ shosts_files.files }}"
  when:
  - rhel_09_252075 | bool
  - shosts_files is changed
  tags: cat_all,cat1

- name: Prevent account login with empty password (ssh) (RHEL-09-255040)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitEmptyPasswords'
    line: 'PermitEmptyPasswords no'
  when:
  - rhel_09_255040 | bool
  # notify:
  # - restart_sshd
  tags: cat_all,cat1

- name: Enable Pluggable Authentication Module (PAM) interface for SSHD (ssh) (RHEL-09-255050)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^UsePAM'
    line: 'UsePAM yes'
  when:
  - rhel_09_255050 | bool
  # notify:
  # - restart_sshd
  tags: cat_all,cat1

- name: Prevent unattended or automatic login to system via graphical user interface (RHEL-09-271040)
  ansible.builtin.lineinfile:
    path: /etc/gdm/custom.conf
    regexp: '^AutomaticLoginEnable='
    line: 'AutomaticLoginEnable=false'
    insertafter: '\[daemon\]'
    create: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: xdm_etc_t
    selevel: s0
  when:
  - rhel_09_271040 | bool
  - gui_capable.matched > 0 # Only run if Xorg* and/or Xwayland* file(s) found in /usr/bin/
  tags: cat_all,cat1

- name: (INFO ONLY) Verify only "root" account has UID "0" assignment (RHEL-09-411100)
  ansible.builtin.shell: awk -F':' '$3 == 0 {print $1}' /etc/passwd | grep -v root
  ignore_errors: true
  failed_when: false
  changed_when: duplicate_uid_0.stdout != ""
  register: duplicate_uid_0
  when:
  - rhel_09_411100 | bool
  tags: cat_all,cat1

- name: Log findings for RHEL-09-411100 to log file
  ansible.builtin.set_fact:
    log_var: "{{ log_var + ['- RHEL-09-411100 (CAT I): Multiple accounts found with UID 0: {{ duplicate_uid_0.stdout_lines }}'] }}"
  when:
  - duplicate_uid_0 is changed # Only run this task if there were accounts found
  - rhel_09_411100 | bool
  tags: cat_all,cat1

- name: SELinux must be in "enforcing" mode (RHEL-09-431010)
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=enforcing'
  when:
  - rhel_09_431010 | bool
  notify:
  - set_selinux
  tags: cat_all,cat1

- name: Crypto policy files must match files shipped with the operating system (crypto-policies) (RHEL-09-672015)
  ansible.builtin.command: rpm --verify crypto-policies
  ignore_errors: true
  failed_when: false # Suppress output if there is a non-zero return code
  register: crypto_policies_rc
  changed_when: crypto_policies_rc.rc != 0
  when:
  - rhel_09_672015 | bool
  tags: cat_all,cat1

- name: Reinstall crypto policy files if files do not match vendor values (RHEL-09-672015)
  block:
    - name: Reinstall crypto policy files if files do not match vendor values (RHEL-09-672015)
      # The ansible dnf module does not have a method to cleanly reinstall packages; we use command here
      ansible.builtin.command: dnf -y reinstall crypto-policies
  rescue:
    - name: Log findings for RHEL-09-672015 to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- RHEL-09-672015: Encountered error during reinstallation of crypto-policies package'] }}"
  when:
  - rhel_09_672015 | bool
  - crypto_policies_rc.rc != 0
  tags: cat_all,cat1


#######################################################
# PAM STIGS
#######################################################
# The following task deploys fully STIGed pam.d files (password-auth-local, system-auth-local, postlogin-local, su, & sudo).
# It satisfies CAT I RHEL-09-611025.
# It satisfies CAT II's RHEL-09-432035, RHEL-09-611010, RHEL-09-611015, RHEL-09-611020, RHEL-09-611030, RHEL-09-611035,
#   RHEL-09-611040, RHEL-09-611045, RHEL-09-611050, RHEL-09-611055, RHEL-09-611145, & RHEL-09-671025.
# It satisfies CAT III RHEL-09-412075.
- name: Deploy STIG password-auth-local (pam.d) (multiple STIGs)
  ansible.builtin.copy:
    src: password-auth-local
    dest: /etc/pam.d/password-auth-local
    backup: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - pam_stig_files | bool
  notify:
  - relink_password_auth
  tags: cat_all,cat1,cat2,cat3

- name: Deploy STIG system-auth-local (pam.d) (multiple STIGs)
  ansible.builtin.copy:
    src: system-auth-local
    dest: /etc/pam.d/system-auth-local
    backup: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - pam_stig_files | bool
  notify:
  - relink_system_auth
