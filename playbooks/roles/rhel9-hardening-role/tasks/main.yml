- name: Search for any configured IP tunnels (RHEL-09-252045)
  ansible.builtin.shell: grep -ir --no-filename conn /etc/ipsec.conf /etc/ipsec.d/ | sed -e 's/^[ \t]*//' | grep -v '^#'
  # With the recursive grep, we use "--no-filename" so we can use sed on the output
  # The sed command with regex removes any leading whitespace or tabs from the grep output
  # The "grep -v '^#'" then omits any lines that are commented out
  ignore_errors: true
  failed_when: false
  register: iptunnels
  changed_when: iptunnels.stdout | length > 0
  when:
  - rhel_09_252045 | bool
  tags: cat_all,cat2

