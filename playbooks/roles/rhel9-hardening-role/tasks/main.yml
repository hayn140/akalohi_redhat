- name: (INFO ONLY) The rsyslog daemon must not accept log messages from other servers unless it is being used for log aggregation (RHEL-09-652025)
  block:
    - name: (INFO ONLY) The rsyslog daemon must not accept log messages from other servers unless it is being used for log aggregation (RHEL-09-652025)
      ansible.builtin.shell: |
        grep -i modload /etc/rsyslog.conf /etc/rsyslog.d/* 2> /dev/null
        grep -i serverrun /etc/rsyslog.conf /etc/rsyslog.d/* 2> /dev/null
      ignore_errors: true
      failed_when: false
      register: rsyslog_log_accept
      changed_when: rsyslog_log_accept.stdout | length > 0

    - name: Log findings for RHEL-09-652025 to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- RHEL-09-652025: The rsyslog daemon is configured to accept log messages from other servers; this is a finding unless it is a log aggregator'] }}"
      when:
      - rsyslog_log_accept is changed
  rescue:
    - name: Log findings for RHEL-09-652025 to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- RHEL-09-652025: Encountered errors during task execution'] }}"
  when:
  - rhel_09_652025 | bool
  tags: cat_all,cat2

