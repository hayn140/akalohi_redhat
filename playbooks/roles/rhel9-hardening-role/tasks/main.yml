#######################################################
# AIDE STIGS
#######################################################
# The following tasks installs aide, creates a daily cronjob, & deploys a fully STIGed aide configuration file (aide.conf).
# It satisfiles CAT II's RHEL-09-651010, RHEL-09-651015, RHEL-09-651020, & RHEL-09-651025
# It satisfies CAT III's RHEL-09-651030 & RHEL-09-651035
# IMPORTANT! Ensure you update the "aide_email" variable with email address that is monitored by security and/or sysadmin personnel!
- name: The aide package must be installed (RHEL-09-651010)
  block:
    - name: The aide package must be installed (RHEL-09-651010)
      ansible.builtin.dnf:
        name: "aide"
        state: installed
  rescue:
    - name: Log findings for RHEL-09-651010 to log file
      ansible.builtin.set_fact:
        log_var: "{{ log_var + ['- RHEL-09-651010: Encountered error during installation of aide package'] }}"
  when:
  - aide_conf | bool
  tags: cat_all,cat2,cat3

- name: Routinely execute a file integrity scan (cron) (RHEL-09-651015)
  ansible.builtin.blockinfile:
    path: /etc/cron.daily/aide
    insertbefore: BOF
    block: |
      #!/bin/bash
      /usr/sbin/aide --check | /bin/mail -s "$HOSTNAME - Daily AIDE integrity check run" {{ aide_email }}
    create: true
    owner: root
    group: root
    mode: '0755'
    seuser: system_u
    serole: object_r
    setype: bin_t
    selevel: s0
  when:
  - aide_conf | bool
  tags: cat_all,cat2,cat3

- name: Deploy fully STIGed aide configuration file (aide.conf) (RHEL-09-651020, RHEL-09-651025, RHEL-09-651030, & RHEL-09-651035)
  ansible.builtin.copy:
    src: aide.conf
    dest: /etc/aide.conf
    backup: true
    owner: root
    group: root
    mode: '0600'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - aide_conf | bool
  notify:
  - aide_init
  tags: cat_all,cat2,cat3


#######################################################
# AUDIT RULES STIGS
#######################################################
# The following task removes any existing audit rules and replaces them with fully STIG'ed audit rule files (01-audit.rules & 99-finalize.rules).
# It satisfies a large amount of STIGs.
- name: Removing existing audit rules
  ansible.builtin.shell: rm -rf /etc/audit/rules.d/*
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Deploy 01-audit.rules
  ansible.builtin.copy:
    src: 01-audit.rules
    dest: /etc/audit/rules.d/01-audit.rules
    owner: root
    group: root
    seuser: system_u
    serole: object_r
    setype: auditd_etc_t
    selevel: s0
    mode: '0640'
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Deploy 99-finalize.rules
  ansible.builtin.copy:
    src: 99-finalize.rules
    dest: /etc/audit/rules.d/99-finalize.rules
    owner: root
    group: root
    seuser: system_u
    serole: object_r
    setype: auditd_etc_t
    selevel: s0
    mode: '0640'
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Set SELinux Contexts of /var/log/audit directory
  ansible.builtin.command: restorecon -Fr /var/log/audit
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Stop auditd
  ansible.builtin.command: service auditd stop
  ignore_errors: true
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Start auditd
  ansible.builtin.command: service auditd start
  ignore_errors: true
  when:
  - audit_rules | bool
  tags: cat_all,always


