- name: Gather list of files in /etc/crypto-policies/back-ends/ directory (RHEL-09-672020)
  ansible.builtin.shell: for FILE in $(find /etc/crypto-policies/back-ends/ -type f -name "*.config"); do basename -s .config $FILE; done
  # basename extracts only the file name of the file path; -s .config strips the file extension
  # Apply this filter to all files found in /etc/crypto-policies/back-ends/ that end in .config; ignore existing links
  register: crypto_policies_files
  changed_when: crypto_policies_files.stdout | length > 0 
  when:
  - rhel_09_672020 | bool
  tags: cat_all,cat2

- name: Prevent override of system crypto policies (crypto-policies) (RHEL-09-672020)
  ansible.builtin.file:
    src: "/usr/share/crypto-policies/FIPS/{{ item }}.txt" # Path of file to symlink to
    path: "/etc/crypto-policies/back-ends/{{ item }}.config" # Path of symlink
    owner: root
    group: root
    state: link
    force: true # Required if an override config file exists; convert it to a symlink
  with_items:
  - "{{ crypto_policies_files.stdout_lines }}"
  ignore_errors: true
  when:
  - crypto_policies_files is changed
  - rhel_09_672020 | bool
  tags: cat_all,cat2

- name: Configure Kerberos to use system crypto policy (crypto-policies) (RHEL-09-672025)
  ansible.builtin.file:
