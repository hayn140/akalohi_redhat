    path: "{{ item.path }}"
    regexp: '^Defaults\s*timestamp_timeout.*$'
    state: absent
  with_items:
  - "{{ sudoers.files }}"
  when:
  - rhel_09_432015 | bool
  tags: cat_all,cat2

- name: Force invoking of user's password for privilege escalation when using "sudo" (RHEL-09-432020)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  with_items:
  - { regexp: '^Defaults\s*!targetpw$', line: 'Defaults !targetpw' }
  - { regexp: '^Defaults\s*!rootpw$', line: 'Defaults !rootpw' }
  - { regexp: '^Defaults\s*!runaspw$', line: 'Defaults !runaspw' }
  when:
  - rhel_09_432020 | bool
  tags: cat_all,cat2

- name: Remove any nested overrides of password invoking when using "sudo" (RHEL-09-432020)
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^Defaults\s*!?(targetpw|rootpw|runaspw).*$' # The "!?" means zero or one instances of "!"
    state: absent
  with_items:
  - "{{ sudoers.files }}"
  when:
  - rhel_09_432020 | bool
  tags: cat_all,cat2

- name: Require users to reauthenticate for privilege escalation (sudo) (RHEL-09-432025)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^(?!#).*!authenticate.*$' # ^(?!#) = ignore lines that begin with "#"
    state: absent # Remove all lines that contain "!authenticate"
