- name: (INFO ONLY) All local interactive users must have a home directory assigned in the /etc/passwd file (RHEL-09-411060)
  # The following for awk command will accomplish multiple checks:
  # - ($3 >= 1000) will ensure only UIDs greater than or equal to 1000 are returned ($3 is the UID field)
  # - ($7 !~ /nologin/) "!~" is a logical check; this will search for and exclude "nologin" ($7 is the shell field)
  # - (!$6) ensures results only contain those with an empty sixth field (home directory)
  # - { print $1 } outputs the user name
  ansible.builtin.shell: awk -F ':' '($3 >= 1000) && ($7 !~ /nologin/) && (!$6) { print $1 }' /etc/passwd
  ignore_errors: true
  failed_when: false
  changed_when: no_home_dir_assigned.stdout | length > 0 # Mark task as changed only if one or more interactive users do not have a home directory assigned
  register: no_home_dir_assigned
  when:
  - rhel_09_411060 | bool
  tags: cat_all,cat2

- name: Log findings for RHEL-09-411060 to log file
  ansible.builtin.set_fact:
    log_var: "{{ log_var + ['- RHEL-09-411060: Interactive users have been found without a home directory assigned in the /etc/passwd file. Manual action required!'] }}"
  when:
  - rhel_09_411060 | bool
  - no_home_dir_assigned is changed
  tags: cat_all,cat2

- name: (INFO ONLY) All local interactive user home directories defined in /etc/passwd must exist (RHEL-09-411065)
  # The following for loop will accomplish multiple checks:
  # - First, we parse /etc/passwd using awk:
  #   - ($3 >= 1000) will ensure only UIDs greater than or equal to 1000 are returned ($3 is the UID field)
  #   - ($7 !~ /nologin/) "!~" is a logical check; this will search for and exclude "nologin" ($7 is the shell field)
  #   - { print $6 } outputs only the sixth field (home directory)
  # - Next, we check if the home directory exists
  #   - test -d $HOMEDIR will determine this
  # - Finally, a non-zero exit code will be returned if any home directories do not exist
  ansible.builtin.shell: for HOMEDIR in $(awk -F ':' '($3 >= 1000) && ($7 !~ /nologin/) { print $6 }' /etc/passwd); do test -d $HOMEDIR; done
  ignore_errors: true
  failed_when: false
  register: no_home_dir
  changed_when: no_home_dir.rc != 0 # Mark task as changed only if one or more interactive users home dirs do not exist
  when:
  - rhel_09_411065 | bool
  tags: cat_all,cat2

- name: Log findings for RHEL-09-411065 to log file
  ansible.builtin.set_fact:
    log_var: "{{ log_var + ['- RHEL-09-411065: Interactive users have been found with a home directory that does not exist'] }}"
  when:
  - rhel_09_411065 | bool
  - no_home_dir is changed
  tags: cat_all,cat2

