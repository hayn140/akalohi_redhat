- name: Effective dconf policy must match policy keyfiles (GUI) (RHEL-09-271090)
  ansible.builtin.shell: function dconf_needs_update { for db in $(find /etc/dconf/db -maxdepth 1 -type f); do db_mtime=$(stat -c %Y "$db"); keyfile_mtime=$(stat -c %Y "$db".d/* | sort -n | tail -1); if [ -n "$db_mtime" ] && [ -n "$keyfile_mtime" ] && [ "$db_mtime" -lt "$keyfile_mtime" ]; then echo "$db needs update"; return 1; fi; done; }; dconf_needs_update
  ignore_errors: true
  failed_when: false
  register: dconf_needs_update
  changed_when: dconf_needs_update.rc != 0
  when:
  - rhel_09_271090 | bool
  notify:
  - dconf_update
  tags: cat_all,cat2

