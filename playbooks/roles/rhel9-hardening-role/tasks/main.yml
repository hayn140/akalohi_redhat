- name: Finding hidden /root and /home files (RHEL-09-232205)
  ansible.builtin.find:
    paths: "/root"
    use_regex: true
    patterns: 
      - ".*.bash_profile"
      - ".*.bashrc"
      - ".*.tcshrc"
      - ".*.profile"
      - ".*.zshrc"
      - ".*.bash_logout"
      - ".*.cshrc"
    file_type: file
    recurse: true
    hidden: true
  become_user: root
  register: hidden_root_files
  when:
  - rhel_09_232205 | bool
  tags: cat_all,cat2

- name: Filter hidden files that do not have 0740 permissions (RHEL-09-232205)
  ansible.builtin.set_fact: 
    files_to_change: "{{ hidden_root_files.files | selectattr('mode', 'ne', '0740') | map(attribute='path') | list }}"
  when:
  - rhel_09_232205 | bool
  tags: cat_all,cat2

- name: Change permissions to 0740 (RHEL-09-232205)
  ansible.builtin.file: 
    path: "{{ item  }}"
    mode: '0740'
  with_items: "{{ files_to_change }}"
  when: 
  - files_to_change | length > 0
  - rhel_09_232205 | bool
  tags: cat_all,cat2

- name: Prompt user to confirm whether to proceed with NTP Configuration (RHEL-09-252020)
  ansible.builtin.pause:
    prompt: |
      ----------------------------------------------------------------------------------------------------------------------------------------------------
      Do you want to configure NTP? This will require you to input your ntp server. To find which time server you should use, GO NTP.

      Type 'yes' or 'no' and hit 'ENTER'
      ----------------------------------------------------------------------------------------------------------------------------------------------------
  register: ntp_response
  delegate_to: all
  run_once: true
  when:
  - rhel_09_252020 | bool
  tags: cat_all,cat2

- name: Set 'proceed_with_ntp' Variable   (RHEL-09-252020)
  ansible.builtin.set_fact:
    proceed_with_ntp: "{{ ntp_response.user_input | lower == 'yes' }}"
  delegate_to: all
  run_once: true
  when:
  - rhel_09_252020 | bool
  tags: cat_all,cat2

- name: Configure NTP (RHEL-09-252020)
  block: 
  - name: Prompt user for NTP Server Address (RHEL-09-252020)
    ansible.builtin.pause:
      prompt: |
        ----------------------------------------------------------------------------------------------------------------------------------------------------
        Please type the NTP server name and hit 'ENTER'
        
        Example: example.pool.ntp.org
        ----------------------------------------------------------------------------------------------------------------------------------------------------
    register: ntp_server_response
    delegate_to: all
    run_once: true
  when:
  # - proceed_with_ntp
  - rhel_09_252020 | bool
  tags: cat_all,cat2

