    path: /etc/crypto-policies/back-ends/krb5.config # Path of symlink
    owner: root
    group: root
    state: link
    force: true # Required if an override config file exists; convert it to a symlink
  when:
  - rhel_09_672025 | bool
  tags: cat_all,cat2

- name: Configure OpenSSL library to use system crypto policy (openssl.cnf) (RHEL-09-672035)
  ansible.builtin.lineinfile:
