- name: Gather list of any nested sudoers directory configurations (RHEL-08-010379)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^#includedir.*$' # . = any character, * = any number of times, $ = end of line
    state: absent # This is required for the module to complete; if we use state=present we'd have to add a "line:" statement as well
  check_mode: true # Do not actually modify the file, we are gathering a list
  changed_when: false # We aren't modifying the file
  register: sudoers_includedir_count
  when:
  - rhel_08_010379 | bool
  tags: cat_all,cat2

- name: Remove all includedir lines if multiple are found (/etc/sudoers) (RHEL-08-010379)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^#includedir.*$'
    state: absent # Remove all lines beginning with "#includedir"; we add the correct line in a later task
  when:
  - rhel_08_010379 | bool
  - sudoers_includedir_count.found > 1 # If more than one line is found, a noncompliant configuration exists
  tags: cat_all,cat2

- name: Ensure /etc/sudoers.d is only included directory in /etc/sudoers (RHEL-08-010379)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^#includedir /etc/sudoers.d' # NOTE! The "#" does NOT mean this line is commented out in /etc/sudoers!
    line: '#includedir /etc/sudoers.d'
    state: present
  when:
  - rhel_08_010379 | bool
  tags: cat_all,cat2

- name: Gather list of any nested sudoers file configurations (RHEL-08-010379)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^#include\s*.*$' # \s* = any amount of whitespace (this means "#includedir" lines will not match, which is what we want)
    state: absent # This is required for the module to complete; if we use state=present we'd have to add a "line:" statement as well
  check_mode: true # Do not actually modify the file, we are gathering a list
  changed_when: false # We aren't modifying the file
  register: sudoers_includefile_count
  when:
  - rhel_08_010379 | bool
  tags: cat_all,cat2

- name: Remove all include lines if any are found (/etc/sudoers) (RHEL-08-010379)
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^#include\s*.*$'
    state: absent # Remove all lines beginning with "#include"
  when:
  - rhel_08_010379 | bool
  - sudoers_includefile_count.found > 0 # If any line is found, a noncompliant configuration exists
  tags: cat_all,cat2

- name: Gather list of files in /etc/sudoers.d/ (RHEL-08-010379)
  ansible.builtin.find:
    paths: /etc/sudoers.d/
    file_type: file
    follow: true
  register: sudoers
  when:
  - rhel_08_010379 | bool
