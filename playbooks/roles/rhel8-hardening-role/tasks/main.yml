- name: Configure FIPS 140-2 approved cryptographic hashing algorithm for all stored passwords (login.defs) (RHEL-08-010110)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^ENCRYPT_METHOD'
    line: 'ENCRYPT_METHOD SHA512'
  when:
  - rhel_08_010110 | bool
  tags: cat_all,cat2

- name: Gather list of users with weak password hashes in /etc/shadow (RHEL-08-010120)
  # This awk command matches username to a password hash that does NOT begin with the 
  # required "$6$", indicating SHA-512 hashing. It is then piped to a second awk command 
  # to only store the username in the insecure_pw_user variable for later use.
  ansible.builtin.shell: awk -F':' '{ print substr($2,1,3) " " $1 }' /etc/shadow | grep -v '^!' | grep -v '^*' | grep -v '^\$6\$' | awk  '{ print $2 }'
  changed_when: false
  register: insecure_pw_user
  when:
  - rhel_08_010120 | bool
  tags: cat_all,cat2

- name: Lock accounts with weak password hashes (RHEL-08-010120)
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
  loop: "{{ insecure_pw_user.stdout_lines }}"
  when:
  - rhel_08_010120 | bool
  tags: cat_all,cat2

- name: Configure shadow password suite to use sufficient number of hashing rounds (RHEL-08-010130)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^SHA_CRYPT_MIN_ROUNDS'
    line: 'SHA_CRYPT_MIN_ROUNDS 5000'
  when:
  - rhel_08_010130 | bool
  tags: cat_all,cat2

- name: Require authentication upon booting into rescue mode (RHEL-08-010151)
