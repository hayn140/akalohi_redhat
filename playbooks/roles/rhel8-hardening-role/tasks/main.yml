---

#######################################################
# GATHER SYSTEM INFORMATION
#######################################################
- name: Gather list of installed packages
  ansible.builtin.package_facts:
    manager: auto
  tags: cat_all,always

- name: Determine if system uses BIOS
  ansible.builtin.stat:
    path: /boot/grub2/grub.cfg
  register: is_bios
  tags: cat_all,always

- name: Determine if system uses EFI
  ansible.builtin.stat:
    path: /boot/efi/EFI/redhat/grub.cfg
  register: is_efi
  tags: cat_all,always

# If either Xorg or Xwayland, or both, binaries exist, the system is techinically GUI-capable and GUI-related STIGs apply (credit: William Moulton)
- name: Determine if system is GUI-capable
  ansible.builtin.find:
    paths: /usr/bin/
    patterns: 'Xorg,Xwayland'
  register: gui_capable
  tags: cat_all,always


#######################################################
# DISA CAT I STIGS
#######################################################
# - name: Prompt User - Enable FIPS Mode (RHEL-08-010020)
#   ansible.builtin.pause:
#     prompt: "\n\nDo you want to enable FIPS mode. If not, you will need to configure this manually.\n\nType 'yes' or 'no' and hit 'ENTER'\n\n"
#   register: enable_fips_response
#   delegate_to: all
#   run_once: true
#   when:
#   - rhel_08_010020 | bool
#   tags: cat_all,cat1

# - name: Set 'proceed_with_enable_fips' variable - (RHEL-08-010020)
#   ansible.builtin.set_fact:
#     proceed_with_enable_fips: "{{ enable_fips_response.user_input | lower == 'yes' }}"
#   delegate_to: all
#   run_once: true
#   when:
#   - enable_fips_response
#   - rhel_08_010020 | bool
#   tags: cat_all,cat1
  
- name: Get FIPS mode status (RHEL-08-010020)
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: fips_status
  changed_when: false
  when:
  # - proceed_with_enable_fips
  - rhel_08_010020 | bool
  tags: cat_all,cat1

- name: Enable FIPS (requires reboot; automatically adds fips=1 to grub) (RHEL-08-010020)
  ansible.builtin.command: fips-mode-setup --enable
  when:
  # - proceed_with_enable_fips
  - rhel_08_010020 | bool
  - fips_status.stdout != '1'
  tags: cat_all,cat1

- name: Determine if any accounts have blank passwords (RHEL-08-010121)
  ansible.builtin.shell: awk -F':' '!$2 {print $1}' /etc/shadow
  ignore_errors: true
  failed_when: false
  changed_when: false
  register: empty_passwords
  when:
  - rhel_08_010121 | bool
  tags: cat_all,cat1

- name: Lock accounts that have blank passwords (RHEL-08-010121)
  ansible.builtin.user:
    name: "{{ item }}"
    password_lock: true
  loop: "{{ empty_passwords.stdout_lines }}"
  when:
  - rhel_08_010121 | bool
  tags: cat_all,cat1

#######################################################
# GRUB SUPERUSER CONFIGURATION
#######################################################
# The following tasks are interactive and will allow the user to create a unique GRUB superuser username and password.

- name: Prompt User - Set Grub Super USERNAME & PASSWORD (RHEL-08-010141 & RHEL-08-010149)
  ansible.builtin.pause:
    prompt: "\n\nDo you want to set the Grub Super USERNAME & PASSWORD? If not, you will need to configure this manually.\n\nType 'yes' or 'no' and hit 'ENTER'\n\n"
  register: set_grubuserpass_response
  delegate_to: all
  run_once: true
  when:
  - set_grub_superuser | bool
  tags: cat_all,cat1

- name: Set 'proceed_with_set_grubuserpass' variable - (RHEL-08-010141 & RHEL-08-010149)
  ansible.builtin.set_fact:
    proceed_with_set_grubuserpass: "{{ set_grubuserpass_response.user_input | lower == 'yes' }}"
  delegate_to: all
  run_once: true
  when:
  # - set_grubuserpass_response
  - set_grub_superuser | bool
  tags: cat_all,cat1

- name: Enter and Confirm Unique Grub Superuser USERNAME (RHEL-08-010141 & RHEL-08-010149)
  block:
    - name: Prompt user for a Grub Superuser USERNAME
      ansible.builtin.pause:
        prompt: "\nPlease type a unique USERNAME you'd like to use for your Grub Superuser (Do not use 'root' or 'admin' or 'administrator') and hit ENTER"
      register: grub_superuser_username
    - name: Confirm Grub Superuser USERNAME
      ansible.builtin.pause:
        prompt: "\nPlease confirm your Grub Superuser USERNAME and hit ENTER.\nIf you made a mistake please restart this playbook."
      register: grub_superuser_username_confirm
      until: grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
      retries: 5
      delay: 0
  rescue:
    - name: Proceed with Playbook
      ansible.builtin.debug:
        msg: "Usernames do not match after 5 attempts. Continuing with playbook WITHOUT setting a Unique Grub Superuser Username and Password. You will need to either rerun this playbook or configure the Grub Superuser manually."
  delegate_to: all
  run_once: true
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  tags: cat_all,cat1

- name: Create unique grub superuser USERNAME (BIOS) (RHEL-08-010149)
  ansible.builtin.replace:
    path: /etc/grub.d/01_users
    regexp: 'set superusers=.*'
    replace: 'set superusers="{{ grub_superuser_username.user_input }}"'
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_bios.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: Create unique grub superuser USERNAME (EFI) (RHEL-08-010141)
  ansible.builtin.replace:
    path: /etc/grub.d/01_users
    regexp: 'set superusers=.*'
    replace: 'set superusers="{{ grub_superuser_username.user_input }}"'
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_efi.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: Create unique grub superuser USERNAME (BIOS) (RHEL-08-010149)
  ansible.builtin.replace:
    path: /etc/grub.d/01_users
    regexp: 'password_pbkdf2.*'
    replace: 'password_pbkdf2 {{ grub_superuser_username.user_input }} \${GRUB2_PASSWORD}'
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_bios.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: Create unique grub superuser USERNAME (EFI) (RHEL-08-010141)
  ansible.builtin.replace:
    path: /etc/grub.d/01_users
    regexp: 'password_pbkdf2.*'
    replace: 'password_pbkdf2 {{ grub_superuser_username.user_input }} \${GRUB2_PASSWORD}'
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_efi.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: Regenerate grub.cfg file (BIOS) (RHEL-08-010141 & RHEL-08-010149)
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_bios.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input  
  tags: cat_all,cat1

- name: Regenerate grub.cfg file (EFI) (RHEL-08-010141 & RHEL-08-010149)
  ansible.builtin.command: grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  - is_efi.stat.exists
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input  
  tags: cat_all,cat1

- name: Enter and Confirm Grub Superuser PASSWORD (RHEL-08-010140 & RHEL-08-010150)
  block:
    - name: Prompt user for a Grub Superuser PASSWORD
      ansible.builtin.pause:
        prompt: "\nPlease type the PASSWORD you'd like to use for your Grub Superuser '{{ grub_superuser_username.user_input }}' and hit ENTER"
        echo: false
      register: grub_superuser_password
      no_log: true    # Prevent passwords from showing in logs

    - name: Confirm Grub Superuser PASSWORD
      ansible.builtin.pause:
        prompt: "\nPlease confirm your Grub Superuser PASSWORD and hit ENTER"
        echo: false
      register: grub_superuser_password_confirm
      no_log: true    # Prevent passwords from showing in logs
      until: grub_superuser_password_confirm.user_input == grub_superuser_password.user_input
      retries: 5
      delay: 0
  rescue:
    - name: Proceed with Playbook
      ansible.builtin.debug:
        msg: "Passwords do not match after 5 attempts. Continuing with playbook WITHOUT setting Grub Superuser password. You will need to either rerun this playbook or set it manually running the command: $sudo grub2-setpassword."
  delegate_to: all
  run_once: true
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  tags: cat_all,cat1

- name: Install python3-pexpect package to use ansible.builtin.expect module
  ansible.builtin.dnf:
    name: python3-pexpect
    state: present
  when: 
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  # - grub_superuser_password_confirm.user_input == grub_superuser_password.user_input
  tags: cat_all,cat1

- name: Set grub2 superuser password (RHEL-08-010140 & RHEL-08-010150)
  ansible.builtin.expect:
    command: grub2-setpassword
    responses:
      'Enter password:': "{{ grub_superuser_password.user_input }}"
      'Confirm password:': "{{ grub_superuser_password.user_input }}"
  no_log: true    # Prevent passwords from showing in logs
  when:
  # - proceed_with_set_grubuserpass
  - set_grub_superuser | bool
  # - grub_superuser_username_confirm.user_input == grub_superuser_username.user_input
  # - grub_superuser_password_confirm.user_input == grub_superuser_password.user_input
  tags: cat_all,cat1
  
- name: Gather list of software repo config files (RHEL-08-010370)
  ansible.builtin.find:
    paths: /etc/yum.repos.d/
    patterns: '*.repo'
    file_type: file
  register: repos
  when:
  - rhel_08_010370 | bool
  tags: cat_all,cat1

- name: Enforce signature verification of packages from repos (gpgcheck=1) (RHEL-08-010370)
  ansible.builtin.replace:
    path: "{{ item.path }}"
    backup: false
    regexp: 'gpgcheck=0'
    replace: 'gpgcheck=1'
  with_items:
  - "{{ repos.files }}"
  when:
  - rhel_08_010370 | bool
  tags: cat_all,cat1

- name: Enforce signature verification of packages installed locally (localpkg_gpgcheck=1) (RHEL-08-010371)
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^localpkg_gpgcheck='
    line: 'localpkg_gpgcheck=1'
  when:
  - rhel_08_010371 | bool
  tags: cat_all,cat1

- name: Search for any shosts.equiv files on the system (RHEL-08-010460)
  ansible.builtin.find:
    paths: /
    patterns: 'shosts.equiv'
    file_type: file
    recurse: true
  register: shosts_equiv
  when:
  - rhel_08_010460 | bool
  tags: cat_all,cat1

- name: Remove any shosts.equiv files on the system (RHEL-08-010460)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  with_items:
  - "{{ shosts_equiv.files }}"
  when:
  - rhel_08_010460 | bool
  tags: cat_all,cat1

- name: Search for any shosts files on the system (RHEL-08-010470)
  ansible.builtin.find:
    paths: /
    patterns: '*.shosts'
    file_type: file
    recurse: true
  register: shosts_files
  when:
  - rhel_08_010470 | bool
  tags: cat_all,cat1

- name: Remove any shosts files on the system (RHEL-08-010470)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  with_items:
  - "{{ shosts_files.files }}"
  when:
  - rhel_08_010470 | bool
  tags: cat_all,cat1

- name: Prevent unattended or automatic login to system via graphical user interface (RHEL-08-010820)
  ansible.builtin.lineinfile:
    path: /etc/gdm/custom.conf
    regexp: '^AutomaticLoginEnable='
    line: 'AutomaticLoginEnable=false'
    insertafter: '\[daemon\]'
    create: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: xdm_etc_t
    selevel: s0
  when:
  - rhel_08_010820 | bool
  - gui_capable.matched > 0 # Only run if Xorg* and/or Xwayland* file(s) found in /usr/bin/
  tags: cat_all,cat1

- name: Prevent account login with empty password (ssh) (RHEL-08-020330)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitEmptyPasswords'
    line: 'PermitEmptyPasswords no'
  when:
  - rhel_08_020330 | bool
  # notify:
  # - restart_sshd
  tags: cat_all,cat1

- name: Remove telnet-server package (RHEL-08-040000)
  ansible.builtin.dnf:
    name: "telnet-server"
    state: absent
  when:
  - rhel_08_040000 | bool
  tags: cat_all,cat1

- name: Remove rsh-server package (RHEL-08-040010)
  ansible.builtin.dnf:
    name: "rsh-server"
    state: absent
  when:
  - rhel_08_040010 | bool
  tags: cat_all,cat1

- name: Remove tftp-server package (RHEL-08-040190)
  ansible.builtin.dnf:
    name: "tftp-server"
    state: absent
  when:
  - rhel_08_040190 | bool
  tags: cat_all,cat1

- name: Remove vsftpd package (RHEL-08-040360)
  ansible.builtin.dnf:
    name: "vsftpd"
    state: absent
  when:
  - rhel_08_040360 | bool
  tags: cat_all,cat1

- name: Mask ctrl-alt-del.target (RHEL-08-040170)
  # NOTE! For some systems a mask Ansible systemd task will not work as a link may exist pointing ctrl-alt-del.target to reboot.target.
  # Here, we manually perform the mask function.
  ansible.builtin.file:
    src: /dev/null
    dest: /etc/systemd/system/ctrl-alt-del.target
    state: link
    force: true
  ignore_errors: true
  when:
  - rhel_08_040170 | bool
  notify:
  - reload_systemd
  tags: cat_all,cat1

- name: Prevent ctrl-alt-del.target in GUI environments (RHEL-08-040171)
  ansible.builtin.copy:
    src: 00-disable-CAD
    dest: /etc/dconf/db/local.d/00-disable-CAD
    backup: false
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - rhel_08_040171 | bool
  - gui_capable.matched > 0 # Only run if Xorg* and/or Xwayland* file(s) found in /usr/bin/
  notify:
  - dconf_update
  tags: cat_all,cat1

- name: Prevent Ctrl-Alt-Delete burst key sequence (systemd) (RHEL-08-040172)
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^CtrlAltDelBurstAction'
    line: 'CtrlAltDelBurstAction=none'
  when:
  - rhel_08_040172 | bool
  notify:
  - reload_systemd
  tags: cat_all,cat1

- name: Check for duplicate UID "0" assignments (RHEL-08-040200)
  ansible.builtin.shell: awk -F':' '$3 == 0 {print $1}' /etc/passwd | grep -v root
  ignore_errors: true
  failed_when: false
  changed_when: duplicate_uid_0.stdout != ""
  register: duplicate_uid_0
  when:
  - rhel_08_040200 | bool
  tags: cat_all,cat1

- name: Log findings for RHEL-08-040200 to log file (RHEL-08-040200)
  ansible.builtin.set_fact:
    log_var: "{{ log_var + ['- RHEL-08-040200 (CAT I): Multiple accounts found with UID 0: {{ duplicate_uid_0.stdout_lines }}'] }}"
  when:
  - duplicate_uid_0 is changed # Only run this task if there were accounts found
  - rhel_08_040200 | bool
  tags: cat_all,cat1


#######################################################
# PAM STIGS
#######################################################
- name: Deploy STIG password-auth-local (multiple STIGs)
  ansible.builtin.copy:
    src: password-auth-local
    dest: /etc/pam.d/password-auth-local
    backup: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - pam_stig_files | bool
  notify:
  - relink_password_auth
  tags: cat_all,cat1,cat2,cat3

- name: Deploy STIG system-auth-local (multiple STIGs)
  ansible.builtin.copy:
    src: system-auth-local
    dest: /etc/pam.d/system-auth-local
    backup: true
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - pam_stig_files | bool
  notify:
  - relink_system_auth
  tags: cat_all,cat1,cat2,cat3

- name: Deploy STIG postlogin-local (multiple STIGs)
  ansible.builtin.copy:
    src: postlogin-local
    dest: /etc/pam.d/postlogin-local
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - pam_stig_files | bool
  notify:
  - relink_postlogin
  tags: cat_all,cat1,cat2,cat3

- name: Configure "deny = 3" in /etc/security/faillock.conf (RHEL-08-020011)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^deny'
    line: 'deny = 3'
  when:
  - pam_faillock | bool
  tags: cat_all,cat2

- name: Configure "fail_interval = 900" in /etc/security/faillock.conf (RHEL-08-020013)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^fail_interval'
    line: 'fail_interval = 900'
  when:
  - pam_faillock | bool
  tags: cat_all,cat2

- name: Configure "unlock_time = 0" in /etc/security/faillock.conf (RHEL-08-020015)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^unlock_time'
    line: 'unlock_time = 0'
  when:
  - pam_faillock | bool
  tags: cat_all,cat2

- name: Configure "dir = /var/log/faillock" in /etc/security/faillock.conf (RHEL-08-020017)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^dir'
    line: 'dir = /var/log/faillock'
  when:
  - pam_faillock | bool
  tags: cat_all,cat2

- name: Configure "audit" in /etc/security/faillock.conf (RHEL-08-020021)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^audit'
    line: 'audit'
  when:
  - pam_faillock | bool
  tags: cat_all,cat2

- name: Configure "even_deny_root" in /etc/security/faillock.conf (RHEL-08-020023)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^even_deny_root'
    line: 'even_deny_root'
  when:
  - pam_faillock | bool
  tags: cat_all,cat2


#######################################################
# AUDIT RULES STIGS
#######################################################
- name: Removing existing audit rules
  ansible.builtin.shell: rm -rf /etc/audit/rules.d/*
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Deploy 01-audit.rules
  ansible.builtin.copy:
    src: 01-audit.rules
    dest: /etc/audit/rules.d/01-audit.rules
    owner: root
    group: root
    seuser: system_u
    serole: object_r
    setype: auditd_etc_t
    selevel: s0
    mode: '0640'
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Deploy 99-finalize.rules
  ansible.builtin.copy:
    src: 99-finalize.rules
    dest: /etc/audit/rules.d/99-finalize.rules
    owner: root
    group: root
    seuser: system_u
    serole: object_r
    setype: auditd_etc_t
    selevel: s0
    mode: '0640'
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Set SELinux Contexts of /var/log/audit directory
  ansible.builtin.command: restorecon -Fr /var/log/audit
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Stop auditd
  ansible.builtin.command: service auditd stop
  ignore_errors: true
  when:
  - audit_rules | bool
  tags: cat_all,always

- name: Start auditd
  ansible.builtin.command: service auditd start
  ignore_errors: true
  when:
  - audit_rules | bool
  tags: cat_all,always


#######################################################
# DISA CAT II STIGS
#######################################################
- name: Confirm package-signing keys are installed and fingerprints match vendor values (RHEL-08-010019)
  ansible.builtin.shell: gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
  ignore_errors: true
  register: gpg_key_fingerprints
  failed_when: false
  when:
  - rhel_08_010019 | bool
  tags: cat_all,cat2

- name: Output RHEL-08-010019 results to log file (RHEL-08-010019)
  ansible.builtin.set_fact:
    log_var: "{{ log_var + ['- RHEL-08-010019 (CAT II): The following RHEL GPG keys are installed. Verify against published values at https://access.redhat.com/security/team/key.'] + gpg_key_fingerprints.stdout_lines }}"
  when:
  - rhel_08_010019 | bool
  tags: cat_all,cat2

- name: Display DoD Notice and Consent Banner (ssh) (RHEL-08-010040)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Banner'
    line: 'Banner /etc/issue'
  when:
  - rhel_08_010040 | bool
  # notify:
  # - restart_sshd
  tags: cat_all,cat2

- name: Display DoD Notice and Consent Banner (GUI) (RHEL-08-010049 & RHEL-08-010050)
  ansible.builtin.copy:
    src: 01-banner-message
    dest: /etc/dconf/db/local.d/01-banner-message
    owner: root
    group: root
    mode: '0644'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - (rhel_08_010049 | bool) or (rhel_08_010050 | bool)
  - gui_capable.matched > 0 # Only run if Xorg* and/or Xwayland* file(s) found in /usr/bin/
  notify:
  - dconf_update
  tags: cat_all,cat2

