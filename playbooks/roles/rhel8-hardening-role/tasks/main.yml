  when:
  - rhel_08_040026 | bool
  tags: cat_all,cat3

- name: Configure aide.conf (RHEL-08-030650, RHEL-08-040300, & RHEL-08-040310)
  ansible.builtin.copy:
    src: aide.conf
    dest: /etc/aide.conf
    backup: true
    owner: root
    group: root
    mode: '0600'
    seuser: system_u
    serole: object_r
    setype: etc_t
    selevel: s0
  when:
  - (rhel_08_030650 | bool) or (rhel_08_040300 | bool) or (rhel_08_040310 | bool)
  notify:
  - aide_init
  tags: cat_all,cat2,cat3

