  - rhel_08_040090 | bool
  tags: cat_all,cat2
  
- name: Load settings from config files (RHEL-08-040090)
  ansible.builtin.command: sudo sysctl --system
  when:
  - rhel_08_040090 | bool
  tags: cat_all,cat2,always

- name: Apply crypto policies  (RHEL-08-010291)
  ansible.builtin.lineinfile:
    path: /etc/crypto-policies/back-ends/openssh.config
    regexp: 'Ciphers'
    line: "Ciphers aes256-gcm@openssh.com,aes256-ctr,aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr"
    state: present
  when:
  - ssh_crypto_policy | bool
  tags: cat_all,cat2

- name: Add crypto policies for macs (RHEL-08-010290)
  ansible.builtin.lineinfile:
