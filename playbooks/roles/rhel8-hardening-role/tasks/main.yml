# Start of Added Supplemental Tasks
#######################################################
- name: Add cor pattern sysctl (RHEL-08-010671)
  ansible.posix.sysctl:
    name: kernel.core_pattern
    value: 1
    reload: true
  when:
  - rhel_08_010671 | bool
  tags: cat_all,cat2

- name:  Add yama sysctl (RHEL-08-040282)
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: 1
    reload: true
  when:
  - rhel_08_040282 | bool
  tags: cat_all,cat2

- name: Look for all user home directories   (RHEL-08-010730)
  ansible.builtin.command: awk -F':' '$3 >= 1000 && $3 < 65534 {print$6}' /etc/passwd
  register: home_dirs
  when:
  - rhel_08_010730 | bool
  tags: cat_all,cat2

- name: Ensure Permissions are correct (RHEL-08-010730)
  ansible.builtin.find:
    paths: "{{ item }}"
    patterns: ".*"
    file_type: file
  with_items: "{{ home_dirs.stdout_lines }}"
  register: init_files
  when:
  - rhel_08_010730 | bool
  tags: cat_all,cat2

- name: Changing permissions in /home/<USER>   (RHEL-08-010730)
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0740"
  with_items: "{{ init_files.results | map(attribute='files') | flatten }}"
  register: init_files
  when:
  - rhel_08_010730 | bool
  tags: cat_all,cat2

- name: Finding hidden /root and /home files (RHEL-08-010770)
  ansible.builtin.find:
    paths: "/root"
    use_regex: true
    patterns: 
      - ".*.bash_profile"
      - ".*.bashrc"
      - ".*.tcshrc"
      - ".*.profile"
      - ".*.zshrc"
      - ".*.bash_logout"
      - ".*.cshrc"
    file_type: file
    recurse: true
    hidden: true
  become_user: root
  register: hidden_root_files
  when: 
  - rhel_08_010770 |bool
  tags: cat_all,cat2

- name: Filter hidden files that do not have 0740 permissions (RHEL-08-010770)
  ansible.builtin.set_fact: 
    files_to_change: "{{ hidden_root_files.files | selectattr('mode', 'ne', '0740') | map(attribute='path') | list }}"
  when: 
  - rhel_08_010770 |bool
  tags: cat_all,cat2
  
- name: Change permissions to 0740 RHEL-08-010770
  ansible.builtin.file: 
    path: "{{ item  }}"
    mode: '0740'
  with_items: "{{ files_to_change }}"
  when: 
  - files_to_change | length > 0
  - rhel_08_010770 |bool
  tags: cat_all,cat2

- name: Prompt user to confirm whether to proceed NTP (RHEL-08-030740)
  ansible.builtin.pause:
    prompt: |
      ----------------------------------------------------------------------------------------------------------------------------------------------------
      Do you want to configure NTP?  this will require you to input your ntp server. To find which time server you should use, GO NTP.

      Type 'yes' or 'no' and hit 'ENTER'
      ----------------------------------------------------------------------------------------------------------------------------------------------------
  register: ntp_response
  delegate_to: all
  run_once: true
  when:
  - rhel_08_030740 | bool
  tags: cat_all,cat2
  
- name: Set 'proceed_with_ntp' Variable (RHEL-08-030740)
  ansible.builtin.set_fact:
    proceed_with_ntp: "{{ ntp_response.user_input | lower == 'yes' }}"
  delegate_to: all
  run_once: true
  when:
  - rhel_08_030740 | bool
  tags: cat_all,cat2

- name: Configure ntp (RHEL-08-030740)
  block: 
  - name: Prompt user to enter NTP address (RHEL-08-030740)
    ansible.builtin.pause:
      prompt: |
        ----------------------------------------------------------------------------------------------------------------------------------------------------
        Please type the ntp server name and hit 'ENTER'
        
        Example: example.pool.ntp.org
        ----------------------------------------------------------------------------------------------------------------------------------------------------
    register: ntp_server_response
    delegate_to: all
    run_once: true

  - name: Set 'ntp_server' Variable (RHEL-08-030740)
    ansible.builtin.set_fact: 
      ntp_server: "{{ ntp_server_response.user_input }}"
    register: ntp_input
    delegate_to: all
    delegate_facts: true

  - name: Add ntp configuration (RHEL-08-030740)
    ansible.builtin.lineinfile: 
      path: /etc/chrony.conf
      line: server  {{ ntp_server_response.user_input }}  iburst maxpoll 16
      state: present
  
  - name: Restart the ntp service (RHEL-08-030740)
    ansible.builtin.service:
      name: chronyd
      state: restarted
      enabled: yes

  - name: Turn on ntp (RHEL-08-030740)
    ansible.builtin.command: sudo timedatectl set-ntp true
  when: 
  # - proceed_with_ntp
  - rhel_08_030740 | bool
  tags: cat_all,cat2

