  tags: cat_all,cat2

#######################################################
# Start of Partition Related Tasks

# Mount /boot with nosuid (RHEL-08-010571)

- name: Check if separate partition for /boot exists (RHEL-08-010571)
  ansible.builtin.shell:
    cmd: grep '\s/boot\s' /etc/fstab | awk '{print $1}'
  ignore_errors: true
  register: boot_block_device
  when:
  - fstab_boot | bool
  tags: cat_all,cat2

- name: Find fstype for /boot block device (RHEL-08-010571)
  ansible.builtin.shell:
    cmd: grep '\s/boot\s' /etc/fstab | awk '{print $3}'
  ignore_errors: true
  register: boot_fstype
  when:
  - boot_block_device.stdout | length > 0
  - fstab_boot | bool
  tags: cat_all,cat2

- name: Find mount_options for /boot block device (RHEL-08-010571)
  ansible.builtin.shell:
    cmd: grep '\s/boot\s' /etc/fstab | awk '{print $4}'
  ignore_errors: true
  register: boot_mount_options
  when:
  - boot_block_device.stdout | length > 0
  - fstab_boot | bool
  tags: cat_all,cat2  

- name: Check to see if 'defaults' is in mount_options for /boot block device (RHEL-08-010571)
  ansible.builtin.shell:
    cmd: grep '\s/boot\s' /etc/fstab | awk '{print $4}' | grep 'defaults'
  ignore_errors: true
  register: boot_defaults_exists
  when:
  - boot_block_device.stdout | length > 0
  - fstab_boot | bool
  tags: cat_all,cat2  

- name: Check to see if 'nosuid' is already in mount_options for /boot block device (RHEL-08-010571)
  ansible.builtin.shell:
    cmd: grep '\s/boot\s' /etc/fstab | awk '{print $4}' | grep 'nosuid'
  ignore_errors: true
  register: boot_nosuid_exists
  when:
  - boot_block_device.stdout | length > 0
  - fstab_boot | bool
  tags: cat_all,cat2  

- name: Mount /boot with nosuid (RHEL-08-010571)
  block:
  - name: defaults is the only option set on /boot, set nosuid
    ansible.posix.mount:
      path: /boot
      opts: nosuid
      state: present
      src: "{{ boot_block_device.stdout }}"
      fstype: "{{ boot_fstype.stdout }}"
    when:
    - boot_defaults_exists.stdout == 'defaults'

  - name: nosuid option already exists along with other options
    ansible.posix.mount:
      path: /boot
      opts: "{{ boot_mount_options.stdout }}"
      state: present
      src: "{{ boot_block_device.stdout }}"
      fstype: "{{ boot_fstype.stdout }}"
    when:
    - boot_nosuid_exists.stdout | length > 0

  - name: Other options other than defaults exists, appending nosuid
    ansible.posix.mount:
      path: /boot
      opts: "{{ boot_mount_options.stdout }},nosuid"
      state: present
      src: "{{ boot_block_device.stdout }}"
      fstype: "{{ boot_fstype.stdout }}"
    when:
    - boot_defaults_exists.stdout | length == 0
    - boot_nosuid_exists.stdout | length == 0
  when:
  - boot_block_device.stdout | length > 0
  - fstab_boot | bool
  tags: cat_all,cat2

- name: Check to see if 'nodev' is already in mount_options for /boot block device (RHEL-08-010580)
  ansible.builtin.shell:
    cmd: grep '\s/boot\s' /etc/fstab | awk '{print $4}' | grep 'nodev'
  ignore_errors: true
  register: boot_nodev_exists
  when:
  - boot_block_device.stdout | length > 0
  - fstab_boot | bool
  tags: cat_all,cat2  

- name: Mount /boot with nodev (RHEL-08-010580)
  block:
  - name: defaults is the only option set on /boot, set nosuid & nodev
    ansible.posix.mount:
      path: /boot
      opts: nosuid,nodev
      state: present
      src: "{{ boot_block_device.stdout }}"
      fstype: "{{ boot_fstype.stdout }}"
    when:
    - boot_defaults_exists.stdout == 'defaults'

  - name: nodev option already exists along with other options
    ansible.posix.mount:
      path: /boot
      opts: "{{ boot_mount_options.stdout }}"
      state: present
      src: "{{ boot_block_device.stdout }}"
      fstype: "{{ boot_fstype.stdout }}"
    when:
    - boot_nodev_exists.stdout | length > 0

  - name: Other options other than defaults exists, appending nodev
    ansible.posix.mount:
      path: /boot
      opts: "{{ boot_mount_options.stdout }},nodev"
      state: present
      src: "{{ boot_block_device.stdout }}"
      fstype: "{{ boot_fstype.stdout }}"
    when:
    - boot_defaults_exists.stdout | length == 0
    - boot_nodev_exists.stdout | length == 0
  when:
  - boot_block_device.stdout | length > 0
  - fstab_boot | bool
  tags: cat_all,cat2

- name: reload_daemon 
  ansible.builtin.systemd:
    daemon-reload: true
  when:
  - fstab_boot | bool 
  tags: cat_all,cat_2

- name: remount boot partition
  ansible.builtin.command: sudo mount -o remount /boot
  when:
  - fstab_boot | bool
  tags: cat_all,cat_2

# Mount /boot/efi with nosuid (RHEL-08-010572)

- name: Check if separate partition for /boot/efi exists (RHEL-08-010572)
  ansible.builtin.shell:
