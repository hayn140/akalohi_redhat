- name: Disable storing core dumps (sysctl) (RHEL-08-010671)
  ansible.posix.sysctl:
    name: kernel.core_pattern
    value: '|/bin/false'
    state: present
    sysctl_set: true # Verify token value with the sysctl command and set with -w if necessary
    reload: true # Performs a sysctl -p command
  when:
  - rhel_08_010671 | bool
  tags: cat_all,cat2

- name: Gather list of files that enable storing core dumps (sysctl) (RHEL-08-010671)
  ansible.builtin.shell: grep -E '^kernel.core_pattern' /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctll.d/*.conf /lib/sysctl.d/*.conf 2>/dev/null | awk -F':' '{ print $1 }'
  ignore_errors: true
  failed_when: false
  register: coredump_configs
  changed_when: coredump_configs.stdout | length > 0
  when:
  - rhel_08_010671 | bool
  tags: cat_all,cat2

- name: Comment out conflicting configurations enabling storage of core dumps (RHEL-08-010671)
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^(kernel.core_pattern.*$)' # The regexp must be placed in parenthesis
    replace: '#\1'
  with_items:
  - "{{ coredump_configs.stdout_lines }}"
  ignore_errors: true
  failed_when: false
  when:
  - rhel_08_010671 | bool
  - coredump_configs is changed
  tags: cat_all,cat2

